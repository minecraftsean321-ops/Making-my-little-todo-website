<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To Do List</title>
    <link rel="stylesheet" href="mystyle.css">
</head>
<body>
    <div class="container">

    <div class="header">
        <h3>My little todo! ✦</h3>
    </div>

    <div class="content">

        <h1>Things I need to do!</h1>
        <p>Jangan nunda-nunda ya broo</p>

        <div class="form">
        <form>
            <input type="text" id="todo" placeholder="What needs to be done?"><br>
            <button type="button">+ Add</button>
        </form>
        </div>

        <div class="option">

            <div>All</div>
            <div>Active</div>
            <div>Completed</div>

        </div>

        <div class="kegiatan">

            <div>Belajar melodi gitar</div>
            <div>Olahraga calisthenic</div>


        </div>


    </div>




    </div>
</body>
</html>
